<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>登録完了 v1 — 御朱印と、色づく県</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{
  --brand:#f27f0d; --brand400:#FB923C; --brand700:#C2410C; --brand300:#FDBA74; --brand50:#FFF7ED;
  --seal:#DC2626; --ink:#111827; --ink2:#4B5563; --ink3:#9CA3AF; --rule:#E5E7EB; --empty:#E3E4E8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;display:flex;flex-direction:column;
  background:linear-gradient(170deg,var(--brand400) 0%,var(--brand) 55%,var(--brand700) 100%);
  font-family:"Noto Sans JP",-apple-system,sans-serif;color:#fff}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:13px;font-weight:700}

.card{flex:1;margin:4px 16px 0;background:#fff;border-radius:24px;color:var(--ink);
  box-shadow:0 8px 32px rgba(124,45,18,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 20px 26px}

/* 御朱印 */
.stamp{width:150px;aspect-ratio:3/4;border-radius:6px;position:relative;flex:none;
  background:linear-gradient(168deg,#FBF7EF,#F1EADC);
  border:1px solid rgba(17,24,39,.12);
  box-shadow:0 10px 26px rgba(17,24,39,.22)}
/* 御朱印らしさ: 縦書きの墨 + 中央の角印。実際はユーザーが撮った写真が入る */
.sumi i{position:absolute;width:4px;border-radius:2px;background:#1F2937;opacity:.78}
.stamp .seal{position:absolute;left:50%;top:46%;width:44px;height:44px;
  transform:translate(-50%,-50%) rotate(-5deg);border-radius:3px;
  border:3.5px solid rgba(220,38,38,.8)}
.stamp .seal::after{content:"";position:absolute;inset:6px;
  border:2px solid rgba(220,38,38,.55);border-radius:1px}
.stamp .seal2{position:absolute;right:12%;bottom:11%;width:24px;height:24px;border-radius:50%;
  border:2.5px solid rgba(220,38,38,.55)}
.n{font-size:36px;font-weight:900;line-height:1;letter-spacing:-.02em}
.n em{font-style:normal;font-size:18px;font-weight:700;margin-left:2px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  color:var(--seal);background:rgba(220,38,38,.1);border-radius:999px;padding:6px 14px}

/* ミニ地図 */
.minimap{width:132px}
.minimap .grid{display:grid;gap:2px}
.pf{border-radius:2px;background:var(--empty);aspect-ratio:1}
.pf.v1{background:var(--brand300)} .pf.v2{background:var(--brand)} .pf.v3{background:var(--brand700)}
.pf.now{background:var(--seal);box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(220,38,38,.35);
  border-radius:3px;position:relative;z-index:1}
.mmcap{text-align:center;font-size:11px;color:var(--ink3);margin-top:9px}
.mmcap b{color:var(--ink2);font-weight:700}

.spot{text-align:center}
.spot .nm{font-size:17px;font-weight:700}
.spot .dt{font-size:13px;color:var(--ink2);margin-top:3px}

.actions{flex:none;padding:14px 16px 28px;display:flex;flex-direction:column;gap:10px}
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:16px;font-weight:700}
.btn.p{background:#fff;color:var(--brand700)}
.btn.s{border:1.5px solid rgba(255,255,255,.65);color:#fff}
</style></head><body>

<div class="statusbar"><span>9:41</span><span>●●● ▮</span></div>

<div class="card">
  <div class="stamp">
    <span class="sumi">
      <i style="right:18%;top:12%;height:34%"></i>
      <i style="right:30%;top:10%;height:62%"></i>
      <i style="right:42%;top:16%;height:44%"></i>
      <i style="left:20%;top:12%;height:56%"></i>
      <i style="left:11%;top:14%;height:30%"></i>
    </span>
    <i class="seal"></i><i class="seal2"></i>
  </div>

  <div class="n">34<em>枚目</em></div>

  <span class="chip">🗾 東京都、はじめて</span>

  <div class="minimap">
    <div class="grid" id="grid" role="img" aria-label="東京都がいま色づいた日本地図"></div>
    <div class="mmcap"><b id="cnt">13</b> / 47 都道府県</div>
  </div>

  <div class="spot">
    <div class="nm">湯島天満宮</div>
    <div class="dt">2026年9月20日</div>
  </div>
</div>

<div class="actions">
  <div class="btn p">＋ もう1枚記録する</div>
  <div class="btn s">地図に戻る</div>
</div>

<script src="japan-tiles.js"></script>
<script>
const FILL = {"京都府":"v3","宮城県":"v2","神奈川県":"v2","千葉県":"v1","埼玉県":"v1",
  "栃木県":"v1","大阪府":"v1","奈良県":"v1","山形県":"v1","北海道":"v1","静岡県":"v1","愛知県":"v1"};
renderJapan(document.getElementById("grid"), { fill: FILL, now: "東京都", showLabel: false });
document.getElementById("cnt").textContent = Object.keys(FILL).length + 1;
</script>
</body></html>

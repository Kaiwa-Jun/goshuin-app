<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>環のアイコン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{ --seal:#C2342B; --paper:#F7F3EA; --ink3:#9CA3AF; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:#374151;font-family:"Noto Sans JP",-apple-system,sans-serif;color:#E5E7EB;
  padding:26px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font-size:17px;font-weight:700;color:#fff}
.hint{font-size:13px;color:#D1D5DB;max-width:540px;text-align:center;line-height:1.85}
.hint b{color:#FDBA74}
.warn{background:#4B2B2B;border:1px solid #7C3A3A;border-radius:12px;padding:12px 16px;
  max-width:540px;font-size:12.5px;line-height:1.8;color:#FCA5A5}
.warn b{color:#FECACA}
.switch{display:flex;gap:8px}
.switch button{font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;
  border:none;cursor:pointer;background:#1F2937;color:#D1D5DB}
.switch button.on{background:#FDBA74;color:#7C2D12}
.board{background:#1F2937;border-radius:20px;padding:22px;width:580px;display:flex;
  flex-direction:column;gap:20px}
.row{display:flex;align-items:flex-end;gap:16px;padding-bottom:18px;border-bottom:1px solid #374151}
.row:last-child{border-bottom:none;padding-bottom:0}
.meta{width:120px;flex:none}
.meta .nm{font-size:13px;font-weight:700;color:#fff}
.meta .ds{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.55}
.sizes{display:flex;align-items:flex-end;gap:14px}
.size{display:flex;flex-direction:column;align-items:center;gap:5px}
.size .lb{font-size:10px;color:var(--ink3)}
.ico{border-radius:22.37%;display:block;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.home{width:300px;background:linear-gradient(160deg,#5B4B8A,#2E3B5E 60%,#1B2440);
  border-radius:24px;padding:20px 16px;display:grid;grid-template-columns:repeat(4,1fr);
  gap:18px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.home .app{display:flex;flex-direction:column;align-items:center;gap:5px}
.home .app .lb{font-size:9px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.home .other{width:56px;height:56px;border-radius:12.5px;background:rgba(255,255,255,.16)}
.cap{font-size:11px;color:var(--ink3);text-align:center;margin-top:7px}
</style></head><body>

<h1>環のアイコン案</h1>
<div class="warn">
  <b>そのままの環は、満願バッジと同じ絵です。</b>
  アプリの顔と、12ヶ月通った人だけがもらう印1個が、区別できなくなります。
  下は「環らしさは残したまま、満願とは別のもの」にする案です。
</div>
<div class="switch">
  <button data-mode="haku" class="on">白文（朱地）</button>
  <button data-mode="shu">朱文（紙地）</button>
</div>

<div class="board" id="board"></div>
<div id="stage"></div>

<script>
const FRAME =
  'M4.0 5.2 L50 3.4 L96.0 5.0 L97.4 50 L95.8 96.2 L50 97.4 L4.6 95.6 L3.0 50 Z' +
  'M11.6 12.4 L50 10.8 L88.8 12.6 L90.4 50 L88.6 88.2 L50 90.6 L11.2 88.6 L9.8 50 Z';

const dot = (a, rad, r) =>
  `<circle cx="${(50+rad*Math.cos(a)).toFixed(2)}" cy="${(50+rad*Math.sin(a)).toFixed(2)}" r="${r}"/>`;
const ringDots = (n, rad, r, skip=-1) =>
  Array.from({length:n},(_,i)=> i===skip ? '' : dot(-Math.PI/2 + i*2*Math.PI/n, rad, r)).join('');

/** 日本列島を印の中に収める。県境は出さず、ひとかたまりのシルエットにする */
const japan = (scale, cy) => {
  const s = scale / JAPAN_H;
  return `<g transform="translate(${50 - JAPAN_W*s/2} ${cy - scale/2}) scale(${s})">`
       + `<path d="${JAPAN_D}"/></g>`;
};

      <div class="meta"><div class="nm">${m.nm}</div><div class="ds">${m.ds}</div></div>
      <div class="sizes">${SIZES.map(s=>
        `<div class="size">${icon(m,s)}<div class="lb">${s}px</div></div>`).join('')}</div>
    </div>`).join('');

  const pick = MARKS[2];
  document.getElementById('stage').innerHTML = `
    <div class="home">
      <div class="app"><div class="other"></div><div class="lb">カメラ</div></div>
      <div class="app">${icon(pick,56)}<div class="lb">御朱印</div></div>
      <div class="app"><div class="other"></div><div class="lb">マップ</div></div>
      <div class="app"><div class="other"></div><div class="lb">設定</div></div>
    </div>
    <div class="cap">ホーム画面（実寸）— 「環のなかに日本」で</div>`;
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));
  mode=b.dataset.mode; render();
});
render();
</script></body></html>

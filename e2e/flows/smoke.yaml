# スモークテスト: 起動 → オンボーディング通過 → 4タブが表示される
appId: com.goshuin.app
---
- launchApp
# 初回起動時のみオンボーディングを通過する。
# スキップは最終スライドへ飛ぶだけで、抜けるには「続ける」を押す必要がある
# （権限リクエストを回避させないため。App Store Guideline 5.1.1(iv)）
- runFlow:
    when:
      visible: "スキップ"
    commands:
      - tapOn: "スキップ"
- runFlow:
    when:
      visible: "続ける"
    commands:
      - tapOn: "続ける"
      # OS の位置情報ダイアログ
      - runFlow:
          when:
            visible: "Allow While Using App"
          commands:
            - tapOn: "Allow While Using App"
# メインタブの表示確認
- assertVisible: "地図"
- assertVisible: "御朱印帳"
- assertVisible: "あつめる"
- assertVisible: "自分"
# 未ログインでも御朱印帳/あつめるタブに入れる（Issue #102）
- tapOn: "御朱印帳"
- assertVisible: "あなたの御朱印帳"
- tapOn: "あつめる"
- assertVisible: "記録するとここに集計されます"
- tapOn: "地図"

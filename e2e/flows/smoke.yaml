# スモークテスト: 起動 → オンボーディング通過 → 4タブが表示される
appId: com.goshuin.app
---
- launchApp
# 初回起動時のみオンボーディングをスキップ
- runFlow:
    when:
      visible: "スキップ"
    commands:
      - tapOn: "スキップ"
# メインタブの表示確認
- assertVisible: "地図"
- assertVisible: "御朱印帳"
- assertVisible: "あつめる"
- assertVisible: "自分"
# 未ログインでも御朱印帳/あつめるタブに入れる（Issue #102）
- tapOn: "御朱印帳"
- assertVisible: "あなたの御朱印帳"
- tapOn: "あつめる"
- assertVisible: "記録するとここに集計されます"
- tapOn: "地図"

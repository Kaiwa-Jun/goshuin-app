# App Store 用スクリーンショット撮影（docs/project/store-metadata.md の5枚構成）
# 実行: maestro test e2e/flows/store-screenshots.yaml
# 前提: preview-simulator ビルドをインストール済みの 6.7インチ シミュレータが起動中
appId: com.goshuin.app
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'スキップ'
    commands:
      - tapOn: 'スキップ'
- waitForAnimationToEnd:
    timeout: 5000

# 1. 地図画面 —「集めるたび、地図があなたの旅になる。」
- takeScreenshot: screenshots/01-map

# 2. スポット詳細（浅草寺のピンをタップしてボトムシートを出す）
# NOTE: タブバーとピンは Maestro のテキスト検索で拾えないため座標指定にする
- tapOn:
    point: '50%,54%'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/02-spot-detail

# 3. 検索画面（検索バーから。ボトムシートは先に閉じる）
- tapOn:
    point: '50%,25%'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: '50%,10%'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/03-search

# 4. 設定画面（ログイン不要で開ける）
- back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: '87%,94%'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/04-settings

# 5. コレクション（未ログイン時はログイン導線が出る）
- tapOn:
    point: '62%,94%'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/05-collection-login
